<!-- the sandbox's spawn menu.
     Sixteen rows written out rather than generated, because a document is what
     the file says and nothing at runtime can add a box to it. What fills them
     is a walk of the scene registry for everything named `props/`, so adding a
     prop is adding a file - but a tree with more props than there are rows here
     shows the first sixteen and the rest are reached by typing in the search
     box. Growing a list from data is a whole mechanism rather than a line, and
     it is the interface's own step rather than this one.

     The list is shorter than sixteen rows and scrolls, which is what step four
     built it for.

     Each row holds a hyphen rather than nothing: `set_text` writes the run
     of words inside a box, and an empty box has no run to write into. -->
<link rel="stylesheet" href="theme.css">

<body>
	<div class="panel menu">
		<div class="row">
			<div class="heading">spawn</div>
			<div id="shown" class="dim">0</div>
		</div>

		<input id="search" class="search" value="">

		<div id="list" class="list">
			<div id="item0" class="entry">-</div>
			<div id="item1" class="entry">-</div>
			<div id="item2" class="entry">-</div>
			<div id="item3" class="entry">-</div>
			<div id="item4" class="entry">-</div>
			<div id="item5" class="entry">-</div>
			<div id="item6" class="entry">-</div>
			<div id="item7" class="entry">-</div>
			<div id="item8" class="entry">-</div>
			<div id="item9" class="entry">-</div>
			<div id="item10" class="entry">-</div>
			<div id="item11" class="entry">-</div>
			<div id="item12" class="entry">-</div>
			<div id="item13" class="entry">-</div>
			<div id="item14" class="entry">-</div>
			<div id="item15" class="entry">-</div>
		</div>

		<div class="row">
			<div class="dim">click one to drop it</div>
			<div id="dropped" class="dim">0</div>
		</div>
	</div>
</body>
