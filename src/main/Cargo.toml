[package]
name = "colby"
default-run = "colby"
authors.workspace = true
build = "build.rs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "colby"
path = "main.rs"

[features]
default = ["hot_reload", "editor"]
# the three are the runtime's; the bin only says which of them it wants.
# `--no-default-features --features static_game` is what a shipped build looks
# like, and it is what `just clippy-static` lints.
hot_reload = ["colby_runtime/hot_reload"]
editor = ["colby_runtime/editor"]
static_game = ["colby_runtime/static_game"]

[dependencies]
colby_core.workspace = true
# the runtime's defaults are off at the workspace entry, so which of its three
# features this build has is decided by the table above and nowhere else.
colby_runtime.workspace = true

[lints]
workspace = true
