[package]
name = "colby_audio"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
bench = false

# @note: two, and the split between them is the point. Everything but
# `device.rs` is arithmetic over slices and is checked by running it; `cpal` is
# the driver, the thread that is not ours and the callback whose cadence we do
# not decide, and it is reached from exactly one file. @ref the workspace
# manifest for what the dependency costs and what the alternative was.
[dependencies]
colby_core.workspace = true
cpal.workspace = true

# @note: a **dev** dependency, and the same one the renderer has for the same
# reason: the tests below want a real recording rather than a synthesized one,
# and the only honest way to get one is to read the file that ships with the
# workspace through the importer that reads it in earnest. Nothing in a build
# links this.
[dev-dependencies]
colby_asset.workspace = true

[lints]
workspace = true
