[package]
name = "colby_audio"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
bench = false

# @note: no dependency here, and that is on purpose for one commit. What this
# crate is at this point is arithmetic over slices - resampling, panning,
# summing - and every line of it is testable with nothing but a buffer. The
# output device is the next commit and the only thing in the subsystem that
# cannot be checked by running a test. Splitting them apart is what keeps the
# untestable half as small as it turned out to be.
[dependencies]
colby_core.workspace = true

# @note: a **dev** dependency, and the same one the renderer has for the same
# reason: the tests below want a real recording rather than a synthesized one,
# and the only honest way to get one is to read the file that ships with the
# workspace through the importer that reads it in earnest. Nothing in a build
# links this.
[dev-dependencies]
colby_asset.workspace = true

[lints]
workspace = true
