[package]
name = "colby_game"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
bench = false
# @note: `dylib`, not `cdylib`. A cdylib would link its own copy of std and of
# colby_core, which costs the shared allocator, the shared panic runtime that
# makes catch_unwind work across the boundary, and the shared statics the unload
# canary counts on. `rlib` is kept so the host can link the game directly when
# hot-reload is compiled out.
crate-type = [
	"rlib",
	"dylib",
]

[features]
default = ["hot_reload"]
hot_reload = ["colby_core/hot_reload"]

[dependencies]
colby_core.workspace = true

[lints]
workspace = true
