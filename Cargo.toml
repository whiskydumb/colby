[workspace]
resolver = "3"
members = ["src/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["whisky <me@whisky.sh>"]
license = "MIT"

#
# Dependencies
#

[workspace.dependencies.colby_asset]
path = "src/asset"

[workspace.dependencies.colby_audio]
path = "src/audio"

[workspace.dependencies.colby_core]
path = "src/core"

[workspace.dependencies.colby_editor]
path = "src/editor"

[workspace.dependencies.colby_engine]
path = "src/engine"

[workspace.dependencies.colby_game]
path = "src/game"

[workspace.dependencies.colby_net]
path = "src/net"

[workspace.dependencies.colby_physics]
path = "src/physics"

# @note: `default-features = false` here rather than in the one manifest that
# depends on it, because cargo refuses to turn a workspace dependency's defaults
# off at the point of inheritance. Which of the runtime's three features a
# build has is the bin's decision, made in its own feature table.
[workspace.dependencies.colby_runtime]
path = "src/runtime"
default-features = false

[workspace.dependencies.colby_script]
path = "src/script"

[workspace.dependencies.colby_ui]
path = "src/ui"

[workspace.dependencies.bytemuck]
version = "1.25"
default-features = false
features = ["derive"]

# @note: the first external dependency taken in the whole of stage two, and the
# only one in the audio subsystem. It is the *device*, not the mixer: what it
# does is enumerate outputs, negotiate a format with the driver and hand over a
# buffer to fill, and everything that happens to that buffer is written here.
# That is the same bargain wgpu and winit are - a device and a window - and the
# opposite of the one `rapier3d` was refused for, which was an algorithm.
#
# The measured cost on this workspace is **two crates that actually build on
# Windows**, `cpal` and `dasp_sample`: the `windows` crate it binds through is
# already in the lock at the exact version it wants, because wgpu put it there.
# The other twenty-three lock entries are ALSA, CoreAudio and the Objective-C
# bindings for platforms this is not built for.
#
# The alternative was WASAPI by hand through that same `windows` crate: zero new
# dependencies and about three hundred and fifty lines of unsafe COM. It was
# refused for one reason that is not fashion - shared-mode format negotiation is
# a matrix of rates, channel counts and sample types that cannot be tested on one
# machine, and it is exactly where the bugs are. @ref the pre-commit audit list.
[workspace.dependencies.cpal]
version = "0.17"
default-features = false

[workspace.dependencies.ctor]
version = "1.0"
default-features = false
features = ["std", "proc_macro"]

[workspace.dependencies.dtor]
version = "1.0"
default-features = false
features = ["std", "proc_macro"]

# @note: three crates for one subsystem, and the only place in the workspace
# where a dependency draws the user interface rather than helping colby draw it.
# Approved with the architecture: the editor is egui, the *game's* UI is
# HTML/CSS over taffy, and the two never meet. `default-features = false`
# everywhere: egui keeps only its bundled fonts, egui-wgpu's defaults would drag
# in `wgpu/default` and `wgpu/webgl` and undo the feature set the renderer was
# configured with, and egui-winit's optional clipboard and browser-opener are
# not things an editor here needs yet. @ref the pre-commit audit list.
[workspace.dependencies.egui]
version = "0.36"
default-features = false
features = ["default_fonts"]

[workspace.dependencies.egui-wgpu]
version = "0.36"
default-features = false

[workspace.dependencies.egui-winit]
version = "0.36"
default-features = false

[workspace.dependencies.glam]
version = "0.33"
default-features = false
features = ["std"]

[workspace.dependencies.libloading]
version = "0.9"
default-features = false
features = ["std"]

# @note: the one dependency taken purely for the asset compiler. It decodes PNG,
# which happens offline: `.ctex` holds bytes the GPU can take as they are, so
# nothing in the engine or the runner links this. The alternative was writing
# inflate by hand, which is three hundred lines of reproducing someone else's
# work - a different size of problem from the PNG *writer* in `colby_engine`,
# which was sixty lines of arithmetic against pulling a compressor into a
# renderer. @ref the pre-commit audit list.
# @note: the Lua the game's interface is scripted in, and the first dependency
# in the workspace that is a language rather than a library. `vendored` builds
# Lua 5.4 from C sources with `cc`, which is seven lockfile entries - three of
# them linked (`mlua`, `mlua-sys`, `bstr`) and four build-time only (`lua-src`,
# `luajit-src`, `pkg-config`, `which`, none of which a `lua54` build ever calls).
# Against egui's thirty-one and rapier's rejected forty-eight that is cheap, and
# unlike bindings to Jolt it wants no cmake, no C++ and not one `unsafe` block:
# `Lua::new_with` is a safe function, and only the debug library needs the
# unsafe constructor. The cost that is real is a C compiler in `just ci`. @ref
# the pre-commit audit list.
[workspace.dependencies.mlua]
version = "0.12"
default-features = false
features = ["lua54", "vendored"]

# @note: the fourth dependency taken purely for the asset compiler, and the
# argument is exactly png's. The specification for glTF allows JPEG and PNG
# equally, so a model in the wild carries either, and refusing one of them
# means half the files an artist hands over arrive without their textures.
# One lock-file entry with no transitives of its own, decoding offline into a
# `.ctex` the GPU takes as it is, so nothing on a frame's path links it.
# Writing a baseline JPEG decoder by hand is a Huffman table, an inverse
# cosine transform and a chroma upsampler - the same class of reproducing
# somebody else's work that argued for taking `png` rather than writing
# inflate. @ref the pre-commit audit list.
[workspace.dependencies.jpeg-decoder]
version = "0.3"
default-features = false

[workspace.dependencies.png]
version = "0.18"
default-features = false

# @note: the two halves of turning an outline font into an atlas, and the second
# pair of dependencies taken purely for the asset compiler. `ttf-parser` reads
# the tables and hands out contours; `ab_glyph_rasterizer` fills them. Neither
# has a dependency of its own, and neither is linked by the engine or the
# runner: a `.cfont` holds metrics and a distance field, so the font library
# lands offline exactly the way `png` did. Writing the rasterizer by hand was
# the alternative and is the same three hundred lines of reproducing someone
# else's work that argued for taking `png`. @ref the pre-commit audit list.
[workspace.dependencies.ab_glyph_rasterizer]
version = "0.1"
default-features = false
features = ["std"]

[workspace.dependencies.ttf-parser]
version = "0.25"
default-features = false
features = ["std", "opentype-layout"]

[workspace.dependencies.taffy]
version = "0.14"
default-features = false
features = [
	"std",
	"taffy_tree",
	"flexbox",
	"content_size",
]

[workspace.dependencies.pollster]
version = "1.0"
default-features = false

[workspace.dependencies.thiserror]
version = "2.0"
default-features = false
features = ["std"]

[workspace.dependencies.tracing]
version = "0.1"
default-features = false
features = ["std", "attributes"]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
default-features = false
features = ["std", "fmt", "ansi", "env-filter", "smallvec"]

[workspace.dependencies.wgpu]
version = "30.0"
default-features = false
features = ["std", "parking_lot", "wgpu-core", "dx12", "vulkan", "wgsl"]

[workspace.dependencies.winit]
version = "0.30"
default-features = false
features = ["rwh_06"]

#
# Profiles
#
[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

# @note: the asset compiler is optimized even in a debug build, and it is the
# only workspace crate that is. Baking a font is a distance transform over a
# few million supersampled texels, which unoptimized takes thirteen seconds and
# optimized takes a fraction of one - and the runner compiles assets
# synchronously, on the frame that notices the file changed. Nobody steps
# through this crate with a debugger; `just dbg` overrides it back for the day
# somebody does.
[profile.dev.package.colby_asset]
opt-level = 2

[profile.dbg]
inherits = "dev"
debug = "full"

[profile.dbg.package."*"]
debug = "limited"

# the one place the asset compiler is built the way everything else is.
[profile.dbg.package.colby_asset]
opt-level = 0

[profile.bench]
strip = "none"
debug = "line-tables-only"
overflow-checks = false

[profile.release]
lto = "thin"
strip = "symbols"
overflow-checks = true

[profile.release-dbg]
inherits = "release"
debug = "full"
strip = "none"

[profile.release-dbg.package."*"]
debug = "limited"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Hot-reload build. `-Cprefer-dynamic` is not set here because cargo only honours
# per-profile rustflags on nightly; `just hot` exports RUSTFLAGS instead.
[profile.hot]
inherits = "dev"

[profile.hot.package."*"]
opt-level = 2

[profile.hot.package.colby_asset]
opt-level = 2

# Incremental compilation lets rustc choose different codegen-unit names between
# builds, which changes the mangled symbols colby_core.dll exports. A running
# process keeps the core.dll it started with, so a game module rebuilt against a
# renamed symbol set would fail to load mid-session. Deterministic symbol names
# are worth more than incremental on a crate that is not the one being edited.
[profile.hot.package.colby_core]
incremental = false

[workspace.lints.rust]
